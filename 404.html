<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Ryota</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f0e0d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f0e0d'/><text x='46' y='55' text-anchor='middle' dominant-baseline='central' font-family='Georgia,Times New Roman,serif' font-size='72' fill='%23f1eee8'>R</text><circle cx='78' cy='74' r='7' fill='%23ff6a3d'/></svg>">
  <script>
    /* トップページと同じ設定（配色・言語）を引き継ぐ */
    (function () {
      var d = document.documentElement;
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
        if (localStorage.getItem("lang") === "en") d.lang = "en";
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0e0d;
      --surface: #171614;
      --text: #f1eee8;
      --text-2: #b3ada3;
      --border-strong: rgba(241, 238, 232, 0.2);
      --hover-border: #8e897f;
      --accent: #ff6a3d;
      --on-accent: #0f0e0d;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #f3f0e9;
        --surface: #fbf9f5;
        --text: #161412;
        --text-2: #4a463f;
        --border-strong: rgba(22, 20, 18, 0.24);
        --hover-border: #6a655c;
        --accent: #b83a10;
        --on-accent: #ffffff;
      }
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f0e9;
      --surface: #fbf9f5;
      --text: #161412;
      --text-2: #4a463f;
      --border-strong: rgba(22, 20, 18, 0.24);
      --hover-border: #6a655c;
      --accent: #b83a10;
      --on-accent: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      padding: 48px clamp(20px, 6vw, 80px);
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      font-variant-numeric: lining-nums;
      -webkit-font-smoothing: antialiased;
    }
    body:lang(ja) { word-break: auto-phrase; }
    .code { color: var(--text-2); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 {
      margin-top: 14px;
      font-family: "Instrument Serif", "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); }
    p.msg { max-width: 32em; margin: 20px 0 32px; color: var(--text-2); line-height: 1.85; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: border-color 0.2s, background-color 0.2s, filter 0.2s;
    }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .primary { background: var(--accent); color: var(--on-accent); }
    .primary:hover { filter: brightness(1.07); }
    .ghost { border-color: var(--border-strong); color: var(--text); }
    .ghost:hover { border-color: var(--hover-border); background: var(--surface); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Not Found<span>.</span></h1>
    <p class="msg" data-en="The page you're looking for couldn't be found. It may have been moved or deleted.">お探しのページは見つかりませんでした。移動したか、削除された可能性があります。</p>
    <div class="links">
      <a class="primary" href="/" data-en="Back to top">トップへ戻る</a>
      <a class="ghost" href="https://github.com/ryota-ender" target="_blank" rel="noopener">GitHub</a>
    </div>
  </main>
  <script>
    if (document.documentElement.lang === "en") {
      document.querySelectorAll("[data-en]").forEach(function (n) { n.innerHTML = n.getAttribute("data-en"); });
    }
  </script>
</body>
</html>
